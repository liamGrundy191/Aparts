# Local development database
services:
  db:
    image: postgres:16-alpine
    container_name: aparts-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aparts
      POSTGRES_PASSWORD: aparts
      POSTGRES_DB: aparts
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aparts']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
